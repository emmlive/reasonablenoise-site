name: RN Holiday 2E — Integrated Workerd Review (No Deploy)
on:
  push:
    branches:
      - feature/rn-holiday-2e-integrated-review-20261127
  pull_request:
    paths:
      - 'src/lib/holiday-integrated-review.mjs'
      - 'tests/holiday-integrated-workerd-rn2e.test.mjs'
      - '.github/workflows/rn-holiday-2e-integrated-review.yml'
permissions:
  contents: read
jobs:
  test-isolated-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RN_HOLIDAY_CHECKOUT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build isolated Workerd toolchain outside site dependencies
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rn-holiday-2e-isolated"
          mkdir -p "$root"
          printf '{"name":"rn-holiday-2e-synthetic","version":"0.0.0","private":true,"type":"module"}\n' > "$root/package.json"
          echo "RN_MINIFLARE_ROOT=$root" >> "$GITHUB_ENV"
          npm --prefix "$root" install --no-audit --no-fund --save-exact miniflare@4.20260730.0 esbuild@0.28.2
      - name: Run integrated synthetic signed Stripe event through actual Workerd D1
        run: node --test tests/holiday-integrated-workerd-rn2e.test.mjs
      - name: Reverify inherited real D1, SQLite, Stripe isolation and DTF regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/holiday-real-workerd-d1-rn2d.test.mjs
          node --experimental-sqlite --test tests/holiday-disposable-ledger-rn2c.test.mjs
          node --test tests/holiday-stripe-reconciliation-rn2b.test.mjs tests/holiday-payment-decision-rn2a.test.mjs tests/holiday-shop-checkout-isolation.test.mjs tests/stripe-webhook-isolation.test.mjs tests/dtf-quote-artwork.test.mjs
      - name: Build static site
        run: npm run build
      - name: Ensure no production checkout or dependency changes
        shell: bash
        run: |
          set -euo pipefail
          test "$RN_HOLIDAY_CHECKOUT_ENABLED" = false
          git diff --exit-code -- package.json package-lock.json
          test -z "$(git status --short)"
