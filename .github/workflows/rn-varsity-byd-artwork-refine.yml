name: RN Apparel — Artwork and BYD Refinement (No Deploy)
on:
  push:
    branches:
      - feature/rn-varsity-byd-artwork-refine-20261127
  pull_request:
    paths:
      - 'public/shirt-concepts/**'
      - 'src/pages/shirt-designs.astro'
      - 'src/pages/bring-your-design.astro'
      - 'tests/varsity-byd-artwork-refinement.test.mjs'
      - 'tests/varsity-byd-catalog-draft.test.mjs'
      - '.github/workflows/rn-varsity-byd-artwork-refine.yml'
permissions:
  contents: read
jobs:
  apparel-artwork-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RN_HOLIDAY_CHECKOUT_ENABLED: "false"
      RN_HOLIDAY_PROVIDER_TEST_ENABLED: "false"
      RN_HOLIDAY_ISOLATED_INGRESS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Original SVG, ownership, BYD locally prepared brief, no payments
        run: node --test tests/varsity-byd-artwork-refinement.test.mjs tests/varsity-byd-catalog-draft.test.mjs
      - name: USDOT checkout, existing DTF quote and holiday protection
        run: node --test tests/holiday-shop-checkout-isolation.test.mjs tests/stripe-webhook-isolation.test.mjs tests/dtf-quote-artwork.test.mjs
      - name: Astro build with vector preview assets
        run: npm run build
      - name: No production config or dependency drift
        shell: bash
        run: |
          set -euo pipefail
          test "$RN_HOLIDAY_CHECKOUT_ENABLED" = false
          test "$RN_HOLIDAY_PROVIDER_TEST_ENABLED" = false
          test "$RN_HOLIDAY_ISOLATED_INGRESS_ENABLED" = false
          git diff --exit-code -- package.json package-lock.json
          test -z "$(git status --short)"
