name: RN Admin Print Artwork Library — Approval Readiness (No Deploy)
on:
  push:
    branches:
      - feature/rn-admin-print-library-readiness-20261127
  pull_request:
    paths:
      - 'src/lib/print-artwork-catalog.mjs'
      - 'src/pages/admin-orders.astro'
      - 'tests/admin-print-artwork-readiness.test.mjs'
      - '.github/workflows/rn-admin-print-library-readiness.yml'
permissions:
  contents: read
jobs:
  print-library-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RN_HOLIDAY_CHECKOUT_ENABLED: "false"
      RN_HOLIDAY_PROVIDER_TEST_ENABLED: "false"
      RN_HOLIDAY_ISOLATED_INGRESS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Fail-closed artwork ownership, version, proof and R2 evidence contracts
        run: node --test tests/admin-print-artwork-readiness.test.mjs
      - name: Inherited apparel/BYD design contracts
        run: node --test tests/varsity-byd-artwork-refinement.test.mjs tests/varsity-byd-catalog-draft.test.mjs
      - name: Existing USDOT sticker, DTF quote and holiday checkout regression
        run: node --test tests/holiday-shop-checkout-isolation.test.mjs tests/stripe-webhook-isolation.test.mjs tests/dtf-quote-artwork.test.mjs
      - name: Astro build including admin preview
        run: npm run build
      - name: Default-off checkout and dependency integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$RN_HOLIDAY_CHECKOUT_ENABLED" = false
          test "$RN_HOLIDAY_PROVIDER_TEST_ENABLED" = false
          test "$RN_HOLIDAY_ISOLATED_INGRESS_ENABLED" = false
          git diff --exit-code -- package.json package-lock.json
          test -z "$(git status --short)"
