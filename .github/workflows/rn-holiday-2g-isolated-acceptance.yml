name: RN Holiday 2G — Isolated Webhook Acceptance (No Deploy)
on:
  push:
    branches:
      - feature/rn-holiday-2g-isolated-stripe-ingress-20261127
  pull_request:
    paths:
      - 'src/lib/holiday-isolated-ingress.mjs'
      - 'tests/holiday-isolated-ingress-rn2g.test.mjs'
      - '.github/workflows/rn-holiday-2g-isolated-acceptance.yml'
permissions:
  contents: read
jobs:
  local-only-webhook-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RN_HOLIDAY_CHECKOUT_ENABLED: "false"
      RN_HOLIDAY_PROVIDER_TEST_ENABLED: "false"
      RN_HOLIDAY_ISOLATED_INGRESS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Set up isolated Miniflare + esbuild, no site dependency changes
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rn-holiday-2g"
          mkdir -p "$root"
          printf '{"name":"rn-holiday-2g-isolated","version":"0.0.0","private":true,"type":"module"}\n' > "$root/package.json"
          echo "RN_MINIFLARE_ROOT=$root" >> "$GITHUB_ENV"
          npm --prefix "$root" install --no-audit --no-fund --save-exact miniflare@4.20260730.0 esbuild@0.28.2
      - name: 2G local-only webhook negative and review D1 acceptance tests
        run: node --test tests/holiday-isolated-ingress-rn2g.test.mjs
      - name: Inherited provider identity and tax readiness gates
        run: node --test tests/holiday-provider-test-preflight-rn2f.test.mjs tests/holiday-tax-readiness-rn2f.test.mjs
      - name: Inherited genuine local Workerd D1 pipeline tests
        run: node --test tests/holiday-integrated-workerd-rn2e.test.mjs tests/holiday-real-workerd-d1-rn2d.test.mjs
      - name: Inherited disposable SQLite regression
        run: node --experimental-sqlite --test tests/holiday-disposable-ledger-rn2c.test.mjs
      - name: Inherited holiday, USDOT and DTF regression
        run: node --test tests/holiday-stripe-reconciliation-rn2b.test.mjs tests/holiday-payment-decision-rn2a.test.mjs tests/holiday-shop-checkout-isolation.test.mjs tests/stripe-webhook-isolation.test.mjs tests/dtf-quote-artwork.test.mjs
      - run: npm run build
      - name: Ensure default OFF, no changes to dependencies or product checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$RN_HOLIDAY_CHECKOUT_ENABLED" = false
          test "$RN_HOLIDAY_PROVIDER_TEST_ENABLED" = false
          test "$RN_HOLIDAY_ISOLATED_INGRESS_ENABLED" = false
          git diff --exit-code -- package.json package-lock.json
          test -z "$(git status --short)"
