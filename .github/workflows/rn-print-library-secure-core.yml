name: RN Print Library — Verified Access and Private R2 Core (No Deploy)
on:
  push:
    branches:
      - feature/rn-admin-print-library-secure-core-20261127
  pull_request:
    paths:
      - 'src/lib/print-library-secure-core.mjs'
      - 'tests/admin-print-library-secure-core.test.mjs'
      - '.github/workflows/rn-print-library-secure-core.yml'
permissions:
  contents: read
jobs:
  secure-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RN_HOLIDAY_CHECKOUT_ENABLED: "false"
      RN_HOLIDAY_PROVIDER_TEST_ENABLED: "false"
      RN_HOLIDAY_ISOLATED_INGRESS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Genuine cryptographic RS256 JWT validation and private R2 mock integrity
        run: node --test tests/admin-print-library-secure-core.test.mjs
      - name: Existing print library metadata and artwork/BYD contracts
        run: node --test tests/admin-print-artwork-readiness.test.mjs tests/varsity-byd-artwork-refinement.test.mjs tests/varsity-byd-catalog-draft.test.mjs
      - name: Holiday, USDOT and DTF protection
        run: node --test tests/holiday-shop-checkout-isolation.test.mjs tests/stripe-webhook-isolation.test.mjs tests/dtf-quote-artwork.test.mjs
      - run: npm run build
      - name: No production changes or checkout enablement
        shell: bash
        run: |
          set -euo pipefail
          test "$RN_HOLIDAY_CHECKOUT_ENABLED" = false
          test "$RN_HOLIDAY_PROVIDER_TEST_ENABLED" = false
          test "$RN_HOLIDAY_ISOLATED_INGRESS_ENABLED" = false
          git diff --exit-code -- package.json package-lock.json
          test -z "$(git status --short)"
