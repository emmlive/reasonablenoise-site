name: RN Holiday 2H — Stripe Provider Identity and Local Replay (No Deploy)
on:
  push:
    branches:
      - feature/rn-holiday-2h-provider-account-bound-replay-20261127
  pull_request:
    paths:
      - 'src/lib/holiday-provider-bound-review.mjs'
      - 'src/lib/holiday-provider-test-preflight.mjs'
      - 'tests/holiday-provider-bound-review-rn2h.test.mjs'
      - 'tests/holiday-provider-test-preflight-rn2f.test.mjs'
      - '.github/workflows/rn-holiday-2h-provider-bound-review.yml'
permissions:
  contents: read
jobs:
  provider-bound-hold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RN_HOLIDAY_CHECKOUT_ENABLED: "false"
      RN_HOLIDAY_PROVIDER_TEST_ENABLED: "false"
      RN_HOLIDAY_ISOLATED_INGRESS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install local disposable Workerd toolchain only
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/rn-holiday-2h"
          mkdir -p "$root"
          printf '{"name":"rn-holiday-2h-test-only","version":"0.0.0","private":true,"type":"module"}\n' > "$root/package.json"
          echo "RN_MINIFLARE_ROOT=$root" >> "$GITHUB_ENV"
          npm --prefix "$root" install --no-audit --no-fund --save-exact miniflare@4.20260730.0 esbuild@0.28.2
      - name: Phase 2H account-bound review and replay using real local Workerd D1
        run: node --test tests/holiday-provider-bound-review-rn2h.test.mjs
      - name: Real Stripe account object schema, identity and prior tax contracts
        run: node --test tests/holiday-provider-test-preflight-rn2f.test.mjs tests/holiday-tax-readiness-rn2f.test.mjs
      - name: Inherited 2G local ingress and 2E/2D Workerd tests
        run: node --test tests/holiday-isolated-ingress-rn2g.test.mjs tests/holiday-integrated-workerd-rn2e.test.mjs tests/holiday-real-workerd-d1-rn2d.test.mjs
      - name: Inherited SQLite review ledger
        run: node --experimental-sqlite --test tests/holiday-disposable-ledger-rn2c.test.mjs
      - name: Inherited holiday checkout, sticker and DTF regressions
        run: node --test tests/holiday-stripe-reconciliation-rn2b.test.mjs tests/holiday-payment-decision-rn2a.test.mjs tests/holiday-shop-checkout-isolation.test.mjs tests/stripe-webhook-isolation.test.mjs tests/dtf-quote-artwork.test.mjs
      - run: npm run build
      - name: Fail closed on production changes
        shell: bash
        run: |
          set -euo pipefail
          test "$RN_HOLIDAY_CHECKOUT_ENABLED" = false
          test "$RN_HOLIDAY_PROVIDER_TEST_ENABLED" = false
          test "$RN_HOLIDAY_ISOLATED_INGRESS_ENABLED" = false
          git diff --exit-code -- package.json package-lock.json
          test -z "$(git status --short)"
