name: RN Catalog Isolated Gate
on:
  push:
    branches:
      - feature/rn-product-catalog-stock-management-20261127
  pull_request:
    paths:
      - "functions/api/admin-products.js"
      - "migrations/0001_rn_catalog.sql"
      - "tests/rn-catalog-admin.test.mjs"
      - "tests/rn-catalog-workerd.test.mjs"
      - "tests/rn-catalog-hosted-preflight.test.mjs"
      - "docs/rn-final-release-readiness.md"
      - "scripts/rn-catalog-hosted-boundary.mjs"
      - "tests/rn-catalog-hosted-boundary.test.mjs"
      - "scripts/rn-catalog-hosted-preflight.mjs"
      - "tests/test_rn_catalog_migration.py"
      - ".github/workflows/rn-catalog-gate.yml"
      - "scripts/rn-pages-preview-d1-candidate.mjs"
      - "tests/rn-pages-preview-d1-candidate.test.mjs"
      - "scripts/rn-catalog-preview-dependency-audit.mjs"
      - "tests/rn-catalog-preview-dependency-audit.test.mjs"
      - "functions/api/_middleware.js"
      - "tests/rn-catalog-preview-middleware.test.mjs"
      - "scripts/rn-pages-preview-disabled-auth-candidate.mjs"
      - "tests/rn-pages-preview-disabled-auth-candidate.test.mjs"
      - "src/pages/admin-catalog.astro"
      - "tests/rn-catalog-admin-screen.test.mjs"
      - "functions/_catalog-checkout-gate.js"
      - "functions/api/create-checkout-session.js"
      - "tests/rn-catalog-checkout-gate.test.mjs"
      - "functions/_catalog-order-snapshot.js"
      - "functions/api/stripe-webhook.js"
      - "tests/rn-catalog-order-snapshot.test.mjs"
      - "tests/rn-catalog-integrated-lifecycle.test.mjs"
      - "functions/_catalog-fulfillment-review.js"
      - "functions/api/order-status.js"
      - "functions/api/admin-orders.js"
      - "tests/rn-catalog-fulfillment-review.test.mjs"
      - "src/pages/admin-orders.astro"
      - "src/pages/admin-order-update.astro"
      - "tests/rn-catalog-inventory-review-ui.test.mjs"
      - "functions/api/catalog.js"
      - "src/data/printShopCatalog.js"
      - "src/pages/index.astro"
      - "src/pages/shop.astro"
      - "public/sitemap.xml"
      - "tests/rn-storefront-experience.test.mjs"
      - "tests/brand-voice-rn-v1.test.mjs"
      - "src/pages/dtf-transfers.astro"
      - "src/components/TransferShirtIcon.astro"
      - "src/pages/dtf-shirts.astro"
      - "tests/dtf-transfers-rn3a.test.mjs"
      - "tests/rn-print-shop-workflows.test.mjs"

permissions:
  contents: read

jobs:
  catalog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Isolated admin security and concurrency contracts
        run: node --test tests/rn-catalog-admin.test.mjs
      - name: Hosted configuration preflight contracts (no Cloudflare connection)
        run: node --test tests/rn-catalog-hosted-preflight.test.mjs
      - name: Hosted preview negative-boundary probe contracts (no network)
        run: node --test tests/rn-catalog-hosted-boundary.test.mjs
      - name: Disposable SQLite migration and audit checks
        run: python3 -m unittest discover -s tests -p "test_rn_catalog_migration.py" -v
      - name: Preview D1 configuration candidate isolation contracts (no Cloudflare connection)
        run: node --test tests/rn-pages-preview-d1-candidate.test.mjs
      - name: Preview runtime dependency compatibility contracts (no Cloudflare connection)
        run: node --test tests/rn-catalog-preview-dependency-audit.test.mjs
      - name: Catalog-only preview middleware contracts (no network)
        run: node --test tests/rn-catalog-preview-middleware.test.mjs
      - name: Preview-only disabled authentication config contracts (no deployment)
        run: node --test tests/rn-pages-preview-disabled-auth-candidate.test.mjs
      - name: Catalog admin UI safety contracts
        run: node --test tests/rn-catalog-admin-screen.test.mjs
      - name: Opt-in catalog stock and checkout price gate (mock Stripe only)
        run: node --test tests/rn-catalog-checkout-gate.test.mjs
      - name: Signed catalog paid order snapshot end-to-end tests (mock Stripe, R2)
        run: node --test tests/rn-catalog-order-snapshot.test.mjs
      - name: Paid-order manual inventory review and fulfillment restrictions
        run: node --test tests/rn-catalog-fulfillment-review.test.mjs
      - name: Review flag and signed-approval UI source contracts
        run: node --test tests/rn-catalog-inventory-review-ui.test.mjs
      - name: Light storefront, published availability and static pricing parity
        run: node --test tests/rn-storefront-experience.test.mjs tests/brand-voice-rn-v1.test.mjs
      - name: Recovered DTF transfer and Gang Sheet quote-first workflow contracts
        run: node --test tests/rn-print-shop-workflows.test.mjs tests/dtf-transfers-rn3a.test.mjs
      - name: Astro production build (no deployment)
        run: npm run build
      - name: Install disposable workerd/Miniflare test runtime (no lockfile changes)
        run: npm install --no-save --package-lock=false miniflare@4
      - name: Real workerd D1 batch, rollback, HTTP authorization smoke
        run: node --test tests/rn-catalog-workerd.test.mjs
      - name: Integrated product edit through paid order fulfillment (disposable D1, mocked providers)
        run: node --test tests/rn-catalog-integrated-lifecycle.test.mjs
